    const templateEl = document.querySelector('script[type="__bundler/template"]');

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        if (entry.compressed) {

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();

            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');

    const dead = Array.from(document.scripts);

      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }

    console.error('Bundle unpack error:', err);

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0\">\n  <title>JMC — Shop<\u002Ftitle>\n  <meta name=\"description\" content=\"The collection: ten disciplines, sixty-eight workshops.\">\n\n  <style>/* ============================================\n   JMC — Japan Mastery Collective\n   Design system v2 — Strass-influenced editorial\n   ============================================ */\n\n:root {\n  /* surfaces */\n  --bg:        #fafaf7;     /* warm off-white page */\n  --bg-tile:  #f4efe6;     /* cream product tile */\n  --bg-tile-2:#ebe6db;     /* slightly darker tile */\n  --bg-warm:  #f6f2ea;     /* alt section bg */\n  --bg-card:  #ffffff;\n\n  /* ink */\n  --ink:    #1c1f1d;       /* near-black */\n  --ink-2:  #2c2f2d;\n  --ink-3:  #6a6c66;       /* secondary */\n  --ink-4:  #9a9b94;       /* tertiary / labels */\n  --rule:   #e3ddd1;\n  --rule-2: #ede8dc;\n\n  /* accent */\n  --accent:      #b94a3c;  /* vermillion 朱 — JMC mark */\n  --accent-2:    #a23a2c;\n  --accent-soft: #d97a6c;\n  --dark-block:  #2c3a35;  /* deep teal-green for dark sections */\n\n  /* layout */\n  --max:    1320px;\n  --gutter: clamp(20px, 4vw, 56px);\n  --nav-h:  72px;\n  --notice-h: 36px;\n\n  /* type */\n  --font-sans:    \"Inter Tight\", -apple-system, BlinkMacSystemFont, \"Helvetica Neue\", system-ui, sans-serif;\n  --font-display: \"Cormorant Garamond\", \"Times New Roman\", \"Didot\", \"Bodoni 72\", serif;\n  --font-jp:      \"Noto Serif JP\", \"Hiragino Mincho ProN\", serif;\n\n  --ease: cubic-bezier(.2,.7,.2,1);\n}\n\n* { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; background: var(--bg); }\nhtml { scroll-behavior: smooth; }\n\nbody {\n  color: var(--ink);\n  font-family: var(--font-sans);\n  font-feature-settings: \"ss01\",\"cv11\";\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  font-size: 16px;\n  line-height: 1.5;\n  letter-spacing: -0.005em;\n}\n\nimg { max-width: 100%; display: block; }\nbutton { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }\na { color: inherit; text-decoration: none; }\ninput, select, textarea { font: inherit; color: inherit; }\n\n/* ============================================\n   TYPOGRAPHY UTILITIES\n   ============================================ */\n.eyebrow {\n  font-size: 11px;\n  letter-spacing: 0.28em;\n  text-transform: uppercase;\n  font-weight: 500;\n  color: var(--ink-3);\n}\n.section-title {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: clamp(34px, 5vw, 56px);\n  letter-spacing: 0.06em;\n  text-transform: uppercase;\n  text-align: center;\n  color: var(--ink);\n  line-height: 1.1;\n}\n.serif {\n  font-family: var(--font-display);\n  font-weight: 400;\n}\n\n/* ============================================\n   TOP NOTICE BAR\n   ============================================ */\n.notice {\n  height: var(--notice-h);\n  background: var(--dark-block);\n  color: rgba(255,255,255,0.92);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  font-size: 12px;\n  letter-spacing: 0.12em;\n  text-transform: uppercase;\n  position: relative;\n  z-index: 60;\n  white-space: nowrap;\n  overflow: hidden;\n  padding: 0 56px;\n}\n.notice .nav-arrow {\n  position: absolute;\n  top: 50%; transform: translateY(-50%);\n  color: rgba(255,255,255,0.7);\n  width: 24px; height: 24px;\n  display: flex; align-items: center; justify-content: center;\n  cursor: pointer;\n}\n.notice .nav-arrow.left { left: 16px; }\n.notice .nav-arrow.right { right: 16px; }\n\n/* ============================================\n   NAV — light, on-cream, like Strass\n   ============================================ */\n.nav {\n  position: sticky;\n  top: 0;\n  z-index: 50;\n  height: var(--nav-h);\n  display: grid;\n  grid-template-columns: 1fr auto 1fr;\n  align-items: center;\n  padding: 0 var(--gutter);\n  background: rgba(250,250,247,0.92);\n  backdrop-filter: blur(14px) saturate(1.05);\n  -webkit-backdrop-filter: blur(14px) saturate(1.05);\n  border-bottom: 1px solid var(--rule);\n  transition: background 200ms ease, opacity 320ms ease, transform 320ms ease;\n}\n.nav-left, .nav-right {\n  display: flex;\n  align-items: center;\n  gap: 28px;\n}\n.nav-right { justify-content: flex-end; }\n.nav-center {\n  display: flex;\n  justify-content: center;\n}\n.nav-mark {\n  display: inline-flex;\n  align-items: center;\n  gap: 10px;\n  font-family: var(--font-display);\n  letter-spacing: 0.32em;\n  font-size: 22px;\n  color: var(--ink);\n  text-transform: uppercase;\n}\n.nav-mark img {\n  height: 32px;\n  width: auto;\n}\n.nav-burger {\n  width: 28px; height: 28px;\n  display: flex; flex-direction: column;\n  justify-content: center;\n  gap: 5px;\n}\n.nav-burger span {\n  display: block; height: 1.4px; background: var(--ink);\n  width: 22px;\n}\n.nav-burger span:nth-child(2) { width: 16px; }\n.nav-link {\n  font-size: 11px;\n  letter-spacing: 0.24em;\n  text-transform: uppercase;\n  color: var(--ink-2);\n  font-weight: 500;\n  position: relative;\n}\n.nav-link:hover { color: var(--ink); }\n.nav-link.active::after {\n  content: \"\"; position: absolute;\n  left: 0; right: 0; bottom: -6px;\n  height: 1px; background: var(--ink);\n}\n.nav-locale {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  white-space: nowrap;\n  font-size: 11px;\n  letter-spacing: 0.18em;\n  color: var(--ink-3);\n  text-transform: uppercase;\n}\n\n/* EN / 日本語 language toggle — small text-based pill that matches nav-link */\n.nav-lang {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  background: none;\n  border: 0;\n  padding: 0;\n  cursor: pointer;\n  font-family: var(--font-sans);\n  font-size: 11px;\n  letter-spacing: 0.24em;\n  text-transform: uppercase;\n  color: var(--ink-3);\n  font-weight: 500;\n  line-height: 1;\n}\n.nav-lang:hover .nav-lang-opt:not(.is-active) { color: var(--ink-2); }\n.nav-lang-opt {\n  display: inline-flex;\n  align-items: center;\n  color: var(--ink-3);\n  transition: color 160ms ease;\n  letter-spacing: inherit;\n  font-size: inherit;\n}\n.nav-lang-opt:nth-child(2) {\n  font-family: var(--font-sans);\n  letter-spacing: 0.08em;\n  font-size: 11px;\n}\n.nav-lang-opt.is-active { color: var(--ink); }\n.nav-lang::before {\n  content: \"\";\n  width: 1px; height: 10px;\n  background: var(--rule);\n  margin-right: 0;\n  display: none;\n}\n.nav-lang-opt + .nav-lang-opt {\n  padding-left: 8px;\n  border-left: 1px solid var(--rule);\n}\n.nav.over-video .nav-lang { color: rgba(255,255,255,0.6); }\n.nav.over-video .nav-lang-opt { color: rgba(255,255,255,0.6); }\n.nav.over-video .nav-lang-opt.is-active { color: #fff; }\n.nav.over-video .nav-lang-opt + .nav-lang-opt { border-left-color: rgba(255,255,255,0.25); }\n.nav.over-video .nav-lang:hover .nav-lang-opt:not(.is-active) { color: rgba(255,255,255,0.85); }\n.nav-locale .flag {\n  width: 14px; height: 14px; border-radius: 50%;\n  background: radial-gradient(circle at 50% 50%, #c92020 0 5px, #fff 5px 7px, transparent 7px);\n  background-color: #fff;\n  border: 1px solid var(--rule);\n  display: inline-block;\n}\n\n/* When nav is fully transparent over a hero video */\n.nav.over-video {\n  opacity: 0;\n  pointer-events: none;\n}\n\n/* ============================================\n   FOOTER\n   ============================================ */\n.footer {\n  background: var(--accent);\n  color: rgba(255,255,255,0.95);\n  padding: 80px var(--gutter) 24px;\n  position: relative;\n  z-index: 1;\n}\n.footer-grid {\n  max-width: var(--max);\n  margin: 0 auto;\n  display: grid;\n  grid-template-columns: 1.4fr 1fr 1fr 1.4fr;\n  gap: 48px;\n  align-items: start;\n}\n.footer h4 {\n  font-size: 11px;\n  letter-spacing: 0.24em;\n  text-transform: uppercase;\n  margin: 0 0 20px;\n  font-weight: 600;\n  color: rgba(255,255,255,0.95);\n}\n.footer p, .footer li {\n  font-size: 14px;\n  line-height: 1.6;\n  color: rgba(255,255,255,0.84);\n}\n.footer ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }\n.footer a { color: rgba(255,255,255,0.84); transition: color 160ms ease; }\n.footer a:hover { color: #fff; }\n.footer-newsletter input[type=\"email\"] {\n  width: 100%;\n  padding: 14px 16px;\n  background: transparent;\n  border: 1px solid rgba(255,255,255,0.4);\n  color: #fff;\n  margin-top: 8px;\n  font-size: 14px;\n}\n.footer-newsletter input::placeholder { color: rgba(255,255,255,0.6); }\n.footer-newsletter button {\n  margin-top: 14px;\n  padding: 12px 28px;\n  background: #fff;\n  color: var(--accent);\n  font-size: 11px;\n  letter-spacing: 0.24em;\n  text-transform: uppercase;\n  font-weight: 600;\n  cursor: pointer;\n  transition: background 160ms ease;\n}\n.footer-newsletter button:hover { background: rgba(255,255,255,0.9); }\n.footer-socials {\n  display: flex; gap: 18px;\n  margin-top: 28px;\n}\n.footer-socials a {\n  width: 18px; height: 18px;\n  display: inline-flex; align-items: center; justify-content: center;\n}\n.footer-bottom {\n  max-width: var(--max);\n  margin: 60px auto 0;\n  padding-top: 24px;\n  border-top: 1px solid rgba(255,255,255,0.2);\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  flex-wrap: wrap;\n  gap: 16px;\n  font-size: 12px;\n  color: rgba(255,255,255,0.7);\n  letter-spacing: 0.06em;\n}\n.footer-payments {\n  display: flex; gap: 8px; align-items: center;\n}\n.footer-pay {\n  height: 22px;\n  padding: 4px 10px;\n  background: rgba(255,255,255,0.95);\n  color: #1c1f1d;\n  border-radius: 3px;\n  font-size: 9px;\n  font-weight: 700;\n  letter-spacing: 0.04em;\n  display: inline-flex;\n  align-items: center;\n  font-family: var(--font-sans);\n}\n\n/* ============================================\n   SERVICE PILLARS (4-up icons strip)\n   ============================================ */\n.pillars {\n  background: var(--bg);\n  padding: 64px var(--gutter);\n  border-top: 1px solid var(--rule);\n}\n.pillars-grid {\n  max-width: var(--max);\n  margin: 0 auto;\n  display: grid;\n  grid-template-columns: repeat(4, 1fr);\n  gap: 32px;\n}\n.pillar {\n  text-align: center;\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 14px;\n}\n.pillar-icon {\n  width: 36px; height: 36px;\n  color: var(--ink);\n}\n.pillar-title {\n  font-size: 12px;\n  letter-spacing: 0.24em;\n  text-transform: uppercase;\n  font-weight: 600;\n  color: var(--ink);\n}\n.pillar-desc {\n  font-size: 13px;\n  color: var(--ink-3);\n  line-height: 1.5;\n  max-width: 220px;\n}\n\n/* ============================================\n   BUTTONS\n   ============================================ */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: 8px;\n  padding: 14px 28px;\n  font-size: 11px;\n  letter-spacing: 0.24em;\n  text-transform: uppercase;\n  font-weight: 600;\n  border: 1px solid var(--ink);\n  background: transparent;\n  color: var(--ink);\n  cursor: pointer;\n  transition: all 200ms ease;\n}\n.btn:hover { background: var(--ink); color: #fff; }\n.btn.dark {\n  background: var(--dark-block);\n  color: #fff;\n  border-color: var(--dark-block);\n}\n.btn.dark:hover { background: #1d2823; border-color: #1d2823; }\n.btn.accent {\n  background: var(--accent);\n  color: #fff;\n  border-color: var(--accent);\n}\n.btn.accent:hover { background: var(--accent-2); border-color: var(--accent-2); }\n.btn.full { width: 100%; }\n.btn.ghost {\n  border-color: var(--rule);\n  color: var(--ink);\n}\n.btn.ghost:hover { background: var(--ink); color: #fff; border-color: var(--ink); }\n\n.link-underline {\n  display: inline-flex;\n  align-items: center;\n  gap: 6px;\n  border-bottom: 1px solid currentColor;\n  padding-bottom: 2px;\n  font-size: 12px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n}\n\n/* ============================================\n   PAGE BANNER (hero strip for category, journal, about, contact)\n   ============================================ */\n.page-banner {\n  position: relative;\n  min-height: 420px;\n  display: flex;\n  align-items: center;\n  padding: 64px var(--gutter);\n  background: var(--bg-tile);\n  overflow: hidden;\n  border-bottom: 1px solid var(--rule);\n}\n.page-banner-inner {\n  max-width: var(--max);\n  margin: 0 auto;\n  width: 100%;\n  position: relative;\n  z-index: 2;\n  color: #fff;\n}\n.page-banner h1 {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: clamp(48px, 7vw, 96px);\n  letter-spacing: 0.04em;\n  text-transform: uppercase;\n  margin: 0 0 16px;\n  color: inherit;\n}\n.page-banner p {\n  font-size: 15px;\n  line-height: 1.6;\n  max-width: 480px;\n  color: inherit;\n  opacity: 0.9;\n}\n.page-banner.light h1 { color: var(--ink); }\n.page-banner.light p { color: var(--ink-3); }\n\n/* ============================================\n   PRODUCT CARD\n   ============================================ */\n.product-card {\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n}\n.product-tile {\n  position: relative;\n  aspect-ratio: 4 / 5;\n  background: var(--bg-tile);\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  overflow: hidden;\n  transition: background 220ms ease;\n}\n.product-tile::after {\n  content: \"\";\n  position: absolute; inset: 0;\n  background: linear-gradient(135deg, rgba(255,255,255,0.18), transparent 60%);\n  pointer-events: none;\n}\n.product-tile-mark {\n  width: 38%;\n  aspect-ratio: 1;\n  border-radius: 50%;\n  background: var(--swatch, #c8a896);\n  position: relative;\n  z-index: 1;\n  box-shadow: inset 0 -10px 20px rgba(0,0,0,0.06), 0 4px 30px rgba(0,0,0,0.05);\n}\n.product-tile-num {\n  position: absolute;\n  top: 14px; left: 14px;\n  font-size: 10px;\n  letter-spacing: 0.24em;\n  color: var(--ink-3);\n  font-weight: 500;\n  z-index: 2;\n}\n.product-tile-cat {\n  position: absolute;\n  top: 14px; right: 14px;\n  font-size: 10px;\n  letter-spacing: 0.24em;\n  color: var(--ink-3);\n  text-transform: uppercase;\n  font-weight: 500;\n  z-index: 2;\n}\n.product-name {\n  font-size: 12px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  font-weight: 500;\n  color: var(--ink);\n}\n.product-maker {\n  font-size: 12px;\n  color: var(--ink-3);\n  margin-top: -8px;\n}\n.product-price {\n  font-size: 13px;\n  color: var(--ink);\n  letter-spacing: 0.06em;\n}\n.product-card a:hover .product-tile { background: var(--bg-tile-2); }\n\n/* ============================================\n   GRID LAYOUTS\n   ============================================ */\n.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: clamp(8px, 1.2vw, 16px); }\n.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(8px, 1.4vw, 24px); }\n.grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: clamp(8px, 1.4vw, 24px); }\n.grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: clamp(4px, 0.6vw, 8px); }\n\n.section { padding: clamp(64px, 9vw, 120px) var(--gutter); }\n.section-narrow { padding: clamp(48px, 6vw, 80px) var(--gutter); }\n.section-inner { max-width: var(--max); margin: 0 auto; }\n.section-eyebrow { text-align: center; margin-bottom: 12px; }\n.section-head {\n  display: flex;\n  flex-direction: column;\n  align-items: center;\n  gap: 12px;\n  margin-bottom: clamp(40px, 5vw, 64px);\n}\n\n/* Responsive */\n@media (max-width: 960px) {\n  .grid-4 { grid-template-columns: repeat(2, 1fr); }\n  .grid-3 { grid-template-columns: 1fr; }\n  .pillars-grid { grid-template-columns: repeat(2, 1fr); gap: 40px 20px; }\n  .footer-grid { grid-template-columns: 1fr 1fr; gap: 40px; }\n}\n@media (max-width: 640px) {\n  .grid-4, .grid-2 { grid-template-columns: 1fr; }\n  .pillars-grid { grid-template-columns: 1fr; }\n  .footer-grid { grid-template-columns: 1fr; }\n  .nav { grid-template-columns: auto 1fr auto; }\n  .nav-right { gap: 16px; }\n  .nav-link.hide-sm { display: none; }\n}\n\n\n/* ============================================\n   PAGE: INDEX\n   ============================================ */\n\n/* Video hero */\n.video-hero {\n  position: relative;\n  height: 100vh;\n  width: 100%;\n  background: #000;\n  overflow: hidden;\n}\n.video-hero-bg {\n  position: absolute; inset: 0;\n  width: 100%; height: 100%;\n  object-fit: cover;\n  display: block;\n}\n.video-hero-vignette {\n  display: none;\n  pointer-events: none;\n  z-index: 1;\n}\n.video-hero-ui {\n  position: absolute; inset: 0;\n  z-index: 2;\n  pointer-events: none;\n  transition: opacity 60ms linear;\n}\n.vh-corner {\n  position: absolute;\n  font-size: 11px;\n  letter-spacing: 0.24em;\n  color: rgba(255,255,255,0.92);\n  font-weight: 500;\n  text-shadow: 0 1px 8px rgba(0,0,0,0.4);\n  display: flex; align-items: center; gap: 12px;\n}\n.vh-corner.tl { top: 28px; left: var(--gutter); }\n.vh-corner.tr { top: 28px; right: var(--gutter); }\n.vh-corner.bl { bottom: 28px; left: var(--gutter); }\n.vh-corner.br { bottom: 28px; right: var(--gutter); }\n.vh-corner.tl .dot {\n  width: 6px; height: 6px; border-radius: 50%;\n  background: var(--accent);\n}\n.vh-corner.br .line {\n  width: 36px; height: 1px; background: rgba(255,255,255,0.6);\n}\n.vh-center {\n  position: absolute;\n  left: 50%; bottom: 22%;\n  transform: translateX(-50%);\n  text-align: center;\n  display: flex; flex-direction: column; gap: 16px;\n  color: #fff;\n  pointer-events: none;\n}\n.vh-tagline {\n  font-size: clamp(40px, 6vw, 88px);\n  letter-spacing: 0.04em;\n  line-height: 1;\n  font-style: italic;\n  font-weight: 400;\n  text-shadow: 0 4px 30px rgba(0,0,0,0.5);\n  font-family: var(--font-display);\n}\n.vh-tagline-jp {\n  font-size: 14px;\n  letter-spacing: 0.4em;\n  font-family: var(--font-jp);\n  opacity: 0.85;\n  text-shadow: 0 2px 10px rgba(0,0,0,0.4);\n}\n\n/* Featured split */\n.featured-split {\n  display: grid;\n  grid-template-columns: 0.85fr 1.15fr;\n  align-items: stretch;\n  background: var(--bg);\n  border-bottom: 1px solid var(--rule);\n}\n.fs-left {\n  padding: clamp(60px, 8vw, 120px) clamp(40px, 6vw, 96px);\n  display: flex;\n  align-items: center;\n}\n.fs-left .eyebrow { margin-bottom: 18px; display: block; }\n.fs-title {\n  font-family: var(--font-display);\n  font-size: clamp(36px, 5vw, 64px);\n  font-weight: 400;\n  line-height: 1.05;\n  letter-spacing: 0.02em;\n  margin: 0 0 24px;\n}\n.fs-desc {\n  font-size: 15px;\n  color: var(--ink-3);\n  line-height: 1.7;\n  max-width: 420px;\n  margin: 0 0 32px;\n}\n.fs-right { position: relative; min-height: 540px; }\n.fs-image {\n  position: absolute; inset: 0;\n  background:\n    radial-gradient(ellipse at 60% 40%, #4a5468 0%, #2a3340 60%, #1a1f28 100%);\n}\n.fs-image::after {\n  content: \"\"; position: absolute; inset: 0;\n  background:\n    radial-gradient(circle at 50% 55%, rgba(220,200,170,0.15) 0%, transparent 35%),\n    linear-gradient(180deg, transparent 60%, rgba(0,0,0,0.3) 100%);\n}\n\n/* Discover Collections — 3-up tall portrait tiles */\n.collections-3 {\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 8px;\n}\n.coll-tile {\n  position: relative;\n  aspect-ratio: 3 / 4;\n  overflow: hidden;\n  background: var(--accent);\n  display: block;\n}\n.coll-img {\n  position: absolute; inset: 0;\n  background:\n    linear-gradient(135deg, color-mix(in oklab, var(--accent) 80%, #000), var(--accent)),\n    radial-gradient(circle at 30% 30%, rgba(255,255,255,0.18), transparent 50%);\n  background-blend-mode: overlay;\n}\n.coll-img::after {\n  content: \"\"; position: absolute; inset: 0;\n  background: linear-gradient(180deg, transparent 35%, rgba(0,0,0,0.35) 100%);\n}\n.coll-overlay {\n  position: absolute;\n  inset: auto 0 0 0;\n  padding: 32px;\n  text-align: center;\n  color: #fff;\n  display: flex; flex-direction: column; align-items: center; gap: 14px;\n  z-index: 2;\n}\n.coll-title {\n  font-size: clamp(20px, 2vw, 30px);\n  letter-spacing: 0.32em;\n  font-weight: 400;\n  font-family: var(--font-display);\n}\n\n/* Two-up category */\n.two-up {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 0;\n  border-top: 1px solid var(--rule);\n}\n.two-up-tile {\n  position: relative;\n  aspect-ratio: 1 / 1;\n  background: var(--accent);\n  overflow: hidden;\n}\n.two-up-img {\n  position: absolute; inset: 0;\n  background:\n    radial-gradient(circle at 50% 50%, color-mix(in oklab, var(--accent) 70%, #fff 5%), color-mix(in oklab, var(--accent) 90%, #000 10%));\n}\n.two-up-img::after {\n  content: \"\"; position: absolute; inset: 0;\n  background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,0.4) 100%);\n}\n.two-up-overlay {\n  position: absolute;\n  inset: 0;\n  padding: 32px;\n  display: flex; flex-direction: column;\n  align-items: center; justify-content: center;\n  gap: 16px;\n  color: #fff;\n  z-index: 2;\n}\n.two-up-title {\n  font-family: var(--font-display);\n  font-size: clamp(28px, 3vw, 48px);\n  letter-spacing: 0.32em;\n  font-weight: 400;\n}\n\n/* Trending — 2-up larger cards */\n.trending-grid {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: clamp(8px, 1.4vw, 24px);\n  max-width: 920px;\n  margin: 0 auto;\n}\n\n/* Brand story */\n.brand-story {\n  position: relative;\n  min-height: 520px;\n  display: flex;\n  align-items: center;\n  justify-content: center;\n  padding: 80px var(--gutter);\n  overflow: hidden;\n}\n.bs-bg {\n  position: absolute; inset: 0;\n  background:\n    radial-gradient(ellipse at 30% 50%, #3a3530 0%, #1c1c1a 70%);\n}\n.bs-bg::after {\n  content: \"\"; position: absolute; inset: 0;\n  background:\n    radial-gradient(circle at 70% 60%, rgba(185,74,60,0.15), transparent 40%),\n    linear-gradient(135deg, rgba(255,255,255,0.04), transparent 50%);\n}\n.bs-card {\n  position: relative;\n  z-index: 2;\n  max-width: 480px;\n  background: var(--bg);\n  padding: 48px 40px;\n  text-align: center;\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n  align-items: center;\n}\n.bs-card .eyebrow { letter-spacing: 0.24em; }\n.bs-title {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: clamp(24px, 3vw, 36px);\n  line-height: 1.2;\n  margin: 0;\n  letter-spacing: 0.02em;\n}\n.bs-body {\n  font-size: 15px;\n  color: var(--ink-3);\n  line-height: 1.65;\n  margin: 0;\n}\n\n/* Magazine */\n.mag-grid { gap: clamp(20px, 2vw, 40px); }\n.mag-card {\n  display: flex;\n  flex-direction: column;\n  gap: 16px;\n}\n.mag-img {\n  aspect-ratio: 4 / 3;\n  background: var(--bg-tile);\n  position: relative;\n  overflow: hidden;\n}\n.mag-img::before {\n  content: \"\"; position: absolute; inset: 0;\n  background:\n    radial-gradient(circle at 30% 50%, color-mix(in oklab, var(--accent) 30%, var(--bg-tile)), var(--bg-tile-2));\n}\n.mag-card[data-kind=\"story\"] .mag-img::before    { background: linear-gradient(135deg, #c8a896, #8a6a4b); }\n.mag-card .mag-img[data-kind=\"collection\"]::before { background: linear-gradient(135deg, #d8c8a8, #8a7a4b); }\n.mag-card .mag-img[data-kind=\"process\"]::before    { background: linear-gradient(135deg, #4a4a4a, #1c1c1c); }\n.mag-meta {\n  display: flex; gap: 6px; align-items: center;\n  font-size: 11px; letter-spacing: 0.2em;\n  color: var(--ink-3); font-weight: 500;\n}\n.mag-title {\n  font-family: var(--font-display);\n  font-size: 20px;\n  line-height: 1.3;\n  font-weight: 400;\n  letter-spacing: 0.01em;\n}\n.mag-maker { font-size: 12px; color: var(--ink-4); letter-spacing: 0.06em; }\n\n@media (max-width: 960px) {\n  .featured-split { grid-template-columns: 1fr; }\n  .fs-right { min-height: 360px; }\n  .collections-3 { grid-template-columns: 1fr; }\n  .trending-grid { grid-template-columns: 1fr; }\n  .two-up { grid-template-columns: 1fr; }\n}\n\n\n/* ============================================\n   PAGE-BANNER ENHANCEMENTS\n   ============================================ */\n.page-banner-img {\n  position: absolute; inset: 0;\n  background:\n    radial-gradient(circle at 30% 50%, color-mix(in oklab, var(--accent) 18%, var(--bg-tile)), var(--bg-tile-2));\n  opacity: 0.6;\n  z-index: 0;\n}\n.page-banner-inner { position: relative; z-index: 1; max-width: 720px; }\n.page-banner-inner .eyebrow { color: var(--ink-3); }\n.page-banner.light { background: var(--bg-tile); }\n\n/* ============================================\n   SHOP — CATEGORY GRID (5×2)\n   ============================================ */\n.cat-grid {\n  display: grid;\n  grid-template-columns: repeat(5, 1fr);\n  gap: clamp(8px, 1vw, 16px);\n}\n.cat-card {\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  text-decoration: none;\n  color: inherit;\n  background: var(--bg);\n  border: 1px solid var(--rule);\n  overflow: hidden;\n  transition: border-color 200ms ease;\n}\n.cat-card:hover { border-color: var(--ink-2); }\n.cat-card .cat-img {\n  position: relative;\n  aspect-ratio: 4 / 5;\n  background:\n    linear-gradient(180deg,\n      color-mix(in oklab, var(--accent, #b94a3c) 18%, var(--bg-tile)),\n      var(--bg-tile-2));\n}\n.cat-card .cat-img::after {\n  content: \"\"; position: absolute;\n  inset: 28%;\n  background: var(--accent, #b94a3c);\n  opacity: 0.16;\n  border-radius: 50%;\n  filter: blur(20px);\n}\n.cat-info {\n  padding: 18px 16px 22px;\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n.cat-num {\n  font-size: 9px;\n  letter-spacing: 0.3em;\n  color: var(--accent);\n  text-transform: uppercase;\n  font-weight: 500;\n}\n.cat-title-row {\n  display: flex;\n  align-items: baseline;\n  justify-content: space-between;\n  gap: 8px;\n}\n.cat-title-en {\n  font-family: var(--font-display);\n  font-size: 22px;\n  font-weight: 400;\n  letter-spacing: 0.02em;\n  color: var(--ink);\n}\n.cat-title-jp {\n  font-family: var(--font-jp);\n  font-size: 13px;\n  letter-spacing: 0.16em;\n  color: var(--ink-3);\n}\n.cat-meta {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  padding-top: 8px;\n  border-top: 1px solid var(--rule-2);\n  font-size: 11px;\n  letter-spacing: 0.16em;\n  text-transform: uppercase;\n  color: var(--ink-3);\n  font-weight: 500;\n}\n.cat-arrow {\n  display: inline-flex;\n  width: 14px; height: 14px;\n  color: var(--ink-3);\n  transition: transform 200ms ease, color 200ms ease;\n}\n.cat-card:hover .cat-arrow { transform: translateX(4px); color: var(--ink); }\n\n@media (max-width: 1100px) { .cat-grid { grid-template-columns: repeat(3, 1fr); } }\n@media (max-width: 720px)  { .cat-grid { grid-template-columns: repeat(2, 1fr); } }\n\n/* ============================================\n   CATEGORY PAGE — banner + toolbar\n   ============================================ */\n.cat-banner {\n  position: relative;\n  min-height: 480px;\n  padding: 80px var(--gutter);\n  display: flex;\n  align-items: center;\n  overflow: hidden;\n  border-bottom: 1px solid var(--rule);\n}\n.cat-banner-img {\n  position: absolute; inset: 0;\n  background:\n    radial-gradient(circle at 25% 50%, color-mix(in oklab, var(--accent, #b94a3c) 60%, #000), color-mix(in oklab, var(--accent, #b94a3c) 30%, #000));\n}\n.cat-banner-overlay {\n  position: absolute; inset: 0;\n  background: linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.35));\n}\n.cat-banner-inner {\n  position: relative;\n  z-index: 1;\n  max-width: var(--max);\n  margin: 0 auto;\n  width: 100%;\n  color: #fff;\n}\n.cat-banner-title {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: clamp(56px, 9vw, 120px);\n  letter-spacing: 0.05em;\n  text-transform: uppercase;\n  line-height: 1.0;\n  margin: 0 0 18px;\n  color: inherit;\n}\n.cat-banner-desc {\n  font-size: 16px;\n  line-height: 1.65;\n  max-width: 560px;\n  margin: 0;\n  opacity: 0.9;\n}\n\n.cat-toolbar {\n  display: grid;\n  grid-template-columns: 1fr auto 1fr;\n  align-items: center;\n  padding: 18px var(--gutter);\n  background: var(--bg);\n  border-bottom: 1px solid var(--rule);\n  position: sticky;\n  top: var(--nav-h);\n  z-index: 30;\n}\n.cat-tools-left {\n  display: flex; gap: 8px;\n}\n.cat-grid-toggle {\n  width: 32px; height: 32px;\n  display: inline-flex; align-items: center; justify-content: center;\n  border: 1px solid var(--rule);\n  background: transparent;\n  color: var(--ink-3);\n  cursor: pointer;\n  transition: all 200ms ease;\n}\n.cat-grid-toggle:hover, .cat-grid-toggle.on {\n  border-color: var(--ink);\n  color: var(--ink);\n}\n.cat-count {\n  font-size: 11px;\n  letter-spacing: 0.24em;\n  text-transform: uppercase;\n  color: var(--ink-3);\n  font-weight: 500;\n}\n.cat-tools-right {\n  display: flex; gap: 12px;\n  justify-content: flex-end;\n  align-items: center;\n}\n.cat-select {\n  appearance: none;\n  -webkit-appearance: none;\n  background: transparent;\n  border: 1px solid var(--rule);\n  padding: 8px 30px 8px 14px;\n  font-size: 11px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--ink);\n  font-family: inherit;\n  cursor: pointer;\n  background-image: url(\"data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%231c1f1d' stroke-width='1.2' fill='none'/><\u002Fsvg>\");\n  background-repeat: no-repeat;\n  background-position: right 12px center;\n}\n.cat-filter-btn {\n  display: inline-flex;\n  align-items: center;\n  gap: 8px;\n  padding: 8px 14px;\n  border: 1px solid var(--rule);\n  background: transparent;\n  font-size: 11px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--ink);\n  cursor: pointer;\n  font-family: inherit;\n  transition: all 200ms ease;\n}\n.cat-filter-btn:hover { background: var(--ink); color: #fff; border-color: var(--ink); }\n\n.cat-products { gap: clamp(12px, 1.4vw, 24px); }\n\n@media (max-width: 720px) {\n  .cat-banner { min-height: 320px; padding: 60px var(--gutter); }\n  .cat-toolbar { grid-template-columns: 1fr; gap: 12px; padding: 14px var(--gutter); }\n  .cat-tools-right { justify-content: flex-start; }\n}\n\n/* ============================================\n   PDP — product detail\n   ============================================ */\n.sticky-bar {\n  position: fixed;\n  top: 0; left: 0; right: 0;\n  height: 64px;\n  background: rgba(255,255,255,0.97);\n  backdrop-filter: blur(14px);\n  -webkit-backdrop-filter: blur(14px);\n  border-bottom: 1px solid var(--rule);\n  z-index: 80;\n  transform: translateY(-100%);\n  transition: transform 280ms var(--ease);\n}\n.sticky-bar.show { transform: translateY(0); }\n.sb-inner {\n  max-width: var(--max);\n  margin: 0 auto;\n  height: 100%;\n  padding: 0 var(--gutter);\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n}\n.sb-left { display: flex; align-items: center; gap: 14px; }\n.sb-thumb {\n  width: 44px; height: 44px;\n  background: var(--bg-tile);\n}\n.sb-name {\n  font-size: 11px;\n  letter-spacing: 0.24em;\n  font-weight: 600;\n  color: var(--ink);\n}\n.sb-price {\n  font-size: 12px;\n  color: var(--ink-3);\n  letter-spacing: 0.06em;\n}\n\n.pdp {\n  display: grid;\n  grid-template-columns: 1.4fr 1fr;\n  gap: clamp(40px, 5vw, 80px);\n  max-width: var(--max);\n  margin: 0 auto;\n  padding: clamp(40px, 6vw, 80px) var(--gutter) clamp(60px, 8vw, 100px);\n}\n.pdp-gallery {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  grid-template-rows: auto auto;\n  gap: clamp(8px, 1vw, 16px);\n}\n.pdp-image {\n  position: relative;\n  aspect-ratio: 4 / 5;\n  background: var(--bg-tile);\n  overflow: hidden;\n}\n.pdp-image.main {\n  grid-column: 1 / -1;\n  aspect-ratio: 16 / 11;\n  background:\n    radial-gradient(circle at 50% 55%, color-mix(in oklab, var(--swatch, #b94a3c) 30%, var(--bg-tile)), var(--bg-tile-2));\n  display: flex;\n  align-items: center;\n  justify-content: center;\n}\n.pdp-image.sub {\n  background:\n    linear-gradient(135deg, color-mix(in oklab, var(--swatch, #b94a3c) 12%, var(--bg-tile)), var(--bg-tile-2));\n}\n.pdp-mark {\n  width: 110px; height: 110px;\n  background: var(--swatch, #b94a3c);\n  border-radius: 50%;\n  filter: blur(2px);\n  opacity: 0.7;\n  box-shadow: 0 30px 60px rgba(0,0,0,0.1);\n}\n.pdp-mark.small { width: 50px; height: 50px; opacity: 0.4; margin: auto; }\n.pdp-image.sub { display: flex; align-items: center; justify-content: center; }\n.pdp-tag {\n  position: absolute;\n  bottom: 18px; left: 22px;\n  font-size: 10px;\n  letter-spacing: 0.24em;\n  text-transform: uppercase;\n  color: var(--ink-3);\n  font-weight: 500;\n}\n\n.pdp-info {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n  padding-top: 12px;\n}\n.pdp-info .eyebrow { display: block; }\n.pdp-title {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: clamp(36px, 4.4vw, 56px);\n  letter-spacing: 0.02em;\n  margin: 8px 0 4px;\n  line-height: 1.05;\n  color: var(--ink);\n}\n.pdp-maker {\n  font-size: 13px;\n  color: var(--ink-3);\n  letter-spacing: 0.06em;\n}\n.pdp-price {\n  font-size: 18px;\n  letter-spacing: 0.06em;\n  margin-top: 14px;\n  color: var(--ink);\n}\n.pdp-rule {\n  border: none;\n  border-top: 1px solid var(--rule);\n  margin: 24px 0 4px;\n}\n.pdp-field { margin: 18px 0 0; }\n.pdp-label {\n  font-size: 11px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--ink-3);\n  margin-bottom: 14px;\n  font-weight: 600;\n}\n.pdp-value {\n  color: var(--ink);\n  margin-left: 6px;\n}\n.pdp-swatches { display: flex; gap: 10px; }\n.pdp-swatch {\n  width: 36px; height: 36px;\n  border: 2px solid transparent;\n  outline: 1px solid var(--rule);\n  outline-offset: 0;\n  cursor: pointer;\n  padding: 0;\n  border-radius: 50%;\n  transition: outline-color 200ms ease;\n}\n.pdp-swatch.on {\n  outline: 1px solid var(--ink);\n  outline-offset: 3px;\n}\n.pdp-sizes { display: flex; gap: 8px; flex-wrap: wrap; }\n.pdp-size {\n  min-width: 56px;\n  padding: 12px 16px;\n  border: 1px solid var(--rule);\n  background: transparent;\n  font-size: 11px;\n  letter-spacing: 0.18em;\n  text-transform: uppercase;\n  color: var(--ink);\n  cursor: pointer;\n  font-family: inherit;\n  transition: all 200ms ease;\n}\n.pdp-size:hover { border-color: var(--ink); }\n.pdp-size.on { border-color: var(--ink); background: var(--ink); color: #fff; }\n.pdp-desc {\n  font-size: 14px;\n  line-height: 1.7;\n  color: var(--ink-3);\n  margin: 24px 0 0;\n}\n.pdp-pairs {\n  display: flex;\n  flex-direction: column;\n  gap: 14px;\n}\n.pdp-pair {\n  display: grid;\n  grid-template-columns: 64px 1fr auto;\n  gap: 14px;\n  align-items: center;\n  padding: 10px;\n  border: 1px solid var(--rule);\n  text-decoration: none;\n  color: inherit;\n  transition: border-color 200ms ease;\n}\n.pdp-pair:hover { border-color: var(--ink-2); }\n.pdp-pair-thumb {\n  width: 64px; height: 64px;\n  background: var(--bg-tile);\n}\n.pdp-pair-name {\n  font-size: 11px;\n  letter-spacing: 0.2em;\n  font-weight: 600;\n  color: var(--ink);\n  margin-bottom: 4px;\n}\n.pdp-pair-price {\n  font-size: 12px;\n  color: var(--ink-3);\n  letter-spacing: 0.06em;\n}\n\n@media (max-width: 820px) {\n  .pdp { grid-template-columns: 1fr; }\n}\n\n/* ============================================\n   ABOUT — split layout\n   ============================================ */\n.about-split {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: clamp(40px, 6vw, 80px);\n  align-items: center;\n}\n.about-img {\n  aspect-ratio: 4 / 5;\n  background:\n    radial-gradient(circle at 30% 50%, color-mix(in oklab, var(--accent) 24%, var(--bg-tile)), var(--bg-tile-2));\n  position: relative;\n}\n.about-img::after {\n  content: \"JMC\";\n  position: absolute;\n  bottom: 24px; right: 28px;\n  font-family: var(--font-display);\n  font-size: 90px;\n  letter-spacing: 0.1em;\n  color: rgba(28,31,29,0.08);\n  font-weight: 400;\n}\n.about-text { display: flex; flex-direction: column; gap: 18px; }\n.about-text .eyebrow { display: block; }\n.about-text p {\n  font-size: 15px;\n  line-height: 1.75;\n  color: var(--ink-3);\n  margin: 0;\n}\n\n@media (max-width: 800px) {\n  .about-split { grid-template-columns: 1fr; }\n}\n\n/* ====================================== {\n  max-width: var(--max);\n  margin: 0 auto;\n}\n.trade-terms-head {\n  margin-bottom: clamp(36px, 5vw, 60px);\n  max-width: 720px;\n}\n.trade-terms-grid {\n  display: grid;\n  grid-template-columns: repeat(2, 1fr);\n  gap: 0;\n  border-top: 1px solid var(--rule);\n  border-left: 1px solid var(--rule);\n}\n.trade-term {\n  padding: 40px clamp(28px, 3vw, 48px) 36px;\n  border-right: 1px solid var(--rule);\n  border-bottom: 1px solid var(--rule);\n  display: flex;\n  flex-direction: column;\n  gap: 12px;\n}\n.trade-term-num {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 32px;\n  color: var(--accent);\n  line-height: 1;\n}\n.trade-term-title {\n  font-family: var(--font-display);\n  font-size: 28px;\n  font-weight: 400;\n  color: var(--ink);\n}\n.trade-term-desc {\n  font-size: 15px;\n  line-height: 1.65;\n  color: var(--ink-3);\n  margin: 0;\n  max-width: 60ch;\n}\n\n/* process */\n.trade-process {\n  padding: clamp(60px, 8vw, 110px) var(--gutter);\n  background: var(--bg-tile);\n  border-bottom: 1px solid var(--rule);\n}\n.trade-process-inner {\n  max-width: 1000px;\n  margin: 0 auto;\n}\n.trade-process-list {\n  list-style: none;\n  margin: 40px 0 0;\n  padding: 0;\n  border-top: 1px solid var(--rule);\n}\n.trade-process-step {\n  display: grid;\n  grid-template-columns: 90px 1fr;\n  gap: 32px;\n  padding: 28px 0;\n  border-bottom: 1px solid var(--rule);\n  align-items: baseline;\n}\n.trade-process-step-n {\n  font-family: var(--font-display);\n  font-style: italic;\n  font-size: 32px;\n  color: var(--accent);\n  line-height: 1;\n}\n.trade-process-step-t {\n  font-family: var(--font-display);\n  font-size: 28px;\n  font-weight: 400;\n  color: var(--ink);\n  margin-bottom: 8px;\n}\n.trade-process-step-d {\n  font-size: 15px;\n  line-height: 1.6;\n  color: var(--ink-3);\n  margin: 0;\n  max-width: 60ch;\n}\n\n/* apply */\n.trade-apply {\n  background: var(--ink);\n  color: #fff;\n  padding: clamp(60px, 8vw, 110px) var(--gutter);\n}\n.trade-apply-inner {\n  max-width: var(--max);\n  margin: 0 auto;\n  display: grid;\n  grid-template-columns: 1fr 1.2fr;\n  gap: clamp(40px, 6vw, 100px);\n  align-items: start;\n}\n.trade-apply-h2 {\n  font-family: var(--font-display);\n  font-weight: 400;\n  font-size: clamp(40px, 5vw, 64px);\n  line-height: 1.05;\n  margin: 0 0 22px;\n  color: #fff;\n}\n.trade-apply-body {\n  font-size: 16px;\n  line-height: 1.65;\n  color: rgba(255,255,255,0.7);\n  margin: 0 0 40px;\n}\n.trade-apply-meta {\n  display: grid;\n  grid-template-columns: 1fr;\n  gap: 28px;\n  padding-top: 28px;\n  border-top: 1px solid rgba(255,255,255,0.18);\n}\n.trade-apply-meta p {\n  font-size: 14px;\n  line-height: 1.55;\n  color: rgba(255,255,255,0.85);\n  margin: 8px 0 0;\n}\n\n.trade-form {\n  background: var(--bg);\n  color: var(--ink);\n  padding: clamp(28px, 3vw, 44px);\n  display: flex;\n  flex-direction: column;\n  gap: 18px;\n  border: 1px solid rgba(255,255,255,0.12);\n}\n.trade-form-row {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 18px;\n}\n.trade-form label {\n  display: flex;\n  flex-direction: column;\n  gap: 6px;\n}\n.trade-form label.full { width: 100%; }\n.trade-form label > span {\n  font-size: 10.5px;\n  letter-spacing: 0.22em;\n  text-transform: uppercase;\n  color: var(--ink-3);\n  font-weight: 500;\n}\n.trade-form input,\n.trade-form select,\n.trade-form textarea {\n  width: 100%;\n  background: transparent;\n  border: 0;\n  border-bottom: 1px solid var(--rule);\n  padding: 10px 0;\n  font-size: 14px;\n  color: var(--ink);\n  border-radius: 0;\n  font-family: inherit;\n  outline: none;\n  transition: border-color 200ms ease;\n}\n.trade-form input:focus,\n.trade-form select:focus,\n.trade-form textarea:focus { border-color: var(--accent); }\n.trade-form textarea { resize: vertical; }\n.trade-form-foot {\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  gap: 24px;\n  padding-top: 14px;\n  border-top: 1px solid var(--rule);\n  margin- mp(6px, 0.6vw, 12px);\n}\n.ig-tile {\n  position: relative;\n  overflow: hidden;\n  display: block;\n  text-decoration: none;\n  color: #fff;\n  background: #111;\n  isolation: isolate;\n  cursor: pointer;\n}\n.ig-tile-feature { grid-column: span 2; grid-row: span 2; }\n.ig-tile-tall    { grid-row: span 2; }\n\n/* image layer (placeholder until real photography lands) */\n.ig-tile-img {\n  position: absolute;\n  inset: 0;\n  background:\n    radial-gradient(120% 90% at 30% 30%,\n      color-mix(in oklab, var(--accent, #b94a3c) 90%, #fff 0%) 0%,\n      color-mix(in oklab, var(--accent, #b94a3c) 60%, #000) 55%,\n      #0a0a0a 100%);\n  transition: transform 700ms cubic-bezier(0.2, 0.6, 0.1, 1);\n  z-index: 0;\n}\n.ig-tile:hover .ig-tile-img { transform: scale(1.04); }\n.ig-tile-img-bloom {\n  position: absolute;\n  inset: -10%;\n  background: radial-gradient(circle at 70% 30%,\n    rgba(255,255,255,0.18), transparent 50%);\n  mix-blend-mode: screen;\n}\n.ig-tile-img-grain {\n  position: absolute; inset: 0;\n  background-image:\n    repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 3px),\n    radial-gradient(circle at 30% 70%, rgba(0,0,0,0.4), transparent 60%);\n  mix-blend-mode: overlay;\n  pointer-events: none;\n}\n\n/* dim/vignette + bottom gradient for legibility */\n.ig-tile::before {\n  content: \"\";\n  position: absolute;\n  inset: 0;\n  background:\n    linear-gradient(180deg,\n      rgba(0,0,0,0.05) 0%,\n      rgba(0,0,0,0.0) 35%,\n      rgba(0,0,0,0.55) 80%,\n      rgba(0,0,0,0.78) 100%);\n  z-index: 1;\n  pointer-events: none;\n  transition: background 320ms ease;\n}\n.ig-tile:hover::before {\n  background:\n    linear-gradient(180deg,\n      rgba(0,0,0,0.15) 0%,\n      rgba(0,0,0,0.05) 25%,\n      rgba(0,0,0,0.7) 75%,\n      rgba(0,0,0,0.88) 100%);\n}\n\n/* corner badges */\n.ig-tile-corner {\n  position: absolute;\n  z-index: 3;\n  display: flex;\n  align-items: baseline;\n  gap: 6px;\n  font-size: 9.5px;\n  letter-spacing: 0. form: translateY(0);\n  color: var(--accent);\n}\n.ig-tile-arrow {\n  display: inline-flex;\n  width: 14px; height: 10px;\n}\n\n/* responsive */\n@media (max-width: 1100px) {\n  .ig-grid { grid-template-columns: repeat(2, 1fr); grid-auto-rows: clamp(280px, 38vw, 420px); }\n  .ig-tile-feature { grid-column: span 2; grid-row: span 1; }\n  .ig-tile-tall    { grid-row: span 1; }\n}\n@media (max-width: 720px) {\n  .ig-grid { grid-template-columns: 1fr; grid-auto-rows: clamp(280px, 70vw, 440px); }\n  .ig-tile-feature { grid-column: span 1; grid-row: span 1; }\n}\n<\u002Fstyle>\n\n  \n<\u002Fhead>\n<body>\n  <div id=\"root\"><\u002Fdiv>\n\n  <script src=\"18771526-1e3e-4c64-bb2c-a795c92f2219\" crossorigin=\"anonymous\"><\u002Fscript>\n  <script src=\"089f6e83-c335-45e8-885a-a831066830f6\" crossorigin=\"anonymous\"><\u002Fscript>\n\n  <script src=\"38056951-f699-494a-af3c-14e707fa3a82\"><\u002Fscript>\n  <script src=\"f6b7fc65-3efa-4886-ad8f-39708bb063a2\"><\u002Fscript>\n  <script src=\"128aa62a-8bf2-4316-85d1-891e92b84346\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
